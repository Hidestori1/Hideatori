.hero{position:relative;background:#2A2420;color:#F1EEE8;border-radius:10px;width:calc(100% - 32px);margin:16px auto 28px;padding:52px 28px 44px;text-align:center;overflow:hidden}
.hero::before{content:"";position:absolute;inset:10px;border:2px dashed rgba(241,238,232,.35);border-radius:6px;pointer-events:none}
.hero h1{border-bottom:0;padding-bottom:0;margin:0 0 24px}
.hero .lg{background:#F1EEE8;width:min(360px,76%);margin:0 auto}
.hero p{max-width:30ch;font-size:clamp(20px,3vw,26px);margin:0 auto 26px;line-height:1.35}
.cta{display:inline-block;background:#C98A4B;color:#1E1A17;font:700 16px "Bricolage Grotesque",system-ui,sans-serif;padding:13px 26px;border-radius:99px;text-decoration:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:#332B25}}
:root[data-theme="dark"] .hero{background:#332B25}
.bar{max-width:1080px;margin:0 auto;padding:0 20px 20px;display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--ink);background:none;border-radius:99px;padding:7px 15px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.grid{max-width:1080px;margin:0 auto;padding:0 20px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:var(--surface);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:4/5;padding:0;border:0;border-bottom:2px dashed var(--line);background:var(--line);display:block;width:100%}
.pic img{width:100%;height:100%;object-fit:cover;object-position:50% 55%;display:block}
.info{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.info h3{margin:0;font-size:21px;letter-spacing:-.02em}
.story{margin:0;color:var(--muted);font-style:italic;font-size:17px;line-height:1.4}
.row{display:flex;justify-content:space-between;align-items:baseline}
.price{font-weight:700;font-size:19px}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.sz{min-width:42px;padding:6px 0;border:1.5px solid var(--line);background:none;border-radius:4px}
.sz[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.add{margin-top:auto;background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:12px;font-weight:700;font-size:16px}
aside{overflow-y:auto}
aside .items{flex:none;max-height:30vh}
.ship{display:grid;gap:10px;margin:4px 0 14px}
.ship label{display:grid;gap:4px;font:600 13px "Bricolage Grotesque",system-ui,sans-serif}
.ship input,.ship textarea{font:400 16px Newsreader,Georgia,serif;padding:10px;border:1.5px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
a.add{display:block;text-align:center;text-decoration:none;font:700 16px "Bricolage Grotesque",system-ui,sans-serif}
a.add[aria-disabled="true"]{opacity:.45;pointer-events:none}
.msg{min-height:1.4em;margin:0;color:var(--accent);font-size:15px}
aside{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:20;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--line)}
aside.open{transform:none}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
aside h2{margin:0 0 12px;font-size:26px;display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;font-size:26px;line-height:1}
.items{flex:1;overflow:auto;border-top:1px dashed var(--line)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 0;border-bottom:1px dashed var(--line)}
.item b{font-family:"Bricolage Grotesque",sans-serif}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:30px;height:30px;border:1.5px solid var(--line);background:none;border-radius:50%}
.total{display:flex;justify-content:space-between;font:700 20px "Bricolage Grotesque",sans-serif;padding:14px 0}
.empty{color:var(--muted);padding:20px 0}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;display:none}
.shade.on{display:block}
footer{text-align:center;color:var(--muted);font-size:15px;padding:0 20px 40px}
</style>
</head>
<body>

<header>
  <div class="logo">hidestori</div>
  <button class="bagbtn" id="open" aria-controls="bag">Bag (<span id="count">0</span>)</button>
</header>

<section class="hero">
  <h1><span class="lg" role="img" aria-label="hidestori premium shoes"></span></h1>
  <p>Leather loafers, monks and boots. Every pair ₹2,499, in sizes 6 to 11.</p><a class="cta" href="#grid">Shop the collection</a>
</section>

<div class="bar" id="filters" role="group" aria-label="Filter by type"></div>
<main class="grid" id="grid"></main>
<footer>hidestori leather shoes</footer>

<div class="shade" id="shade"></div>
<aside id="bag" aria-label="Your bag">
  <h2>Your bag <button class="x" id="close" aria-label="Close bag">×</button></h2>
  <div class="items" id="items"></div>
  <div class="total"><span>Total</span><span id="total">₹0</span></div>
  <div class="ship"><label>Full name<input id="f-n" autocomplete="name"></label><label>Phone number<input id="f-p" type="tel" inputmode="numeric" autocomplete="tel" maxlength="14"></label><label>Delivery address<textarea id="f-a" rows="2" autocomplete="street-address"></textarea></label><div class="two"><label>City<input id="f-c" autocomplete="address-level2"></label><label>Pincode<input id="f-z" inputmode="numeric" maxlength="6" autocomplete="postal-code"></label></div></div>
  <a class="add" id="order" target="_blank" rel="noopener" aria-disabled="true">Order on WhatsApp</a>
  <p class="story" style="font-size:15px;margin:8px 0 0">Your order opens in WhatsApp. We confirm delivery and payment there.</p><p class="msg" id="omsg" role="status"></p>
</aside>

var SIZES=[6,7,8,9,10,11],filter="All",sel={},ph={},cart=[];
var $=function(i){return document.getElementById(i)};
try{var saved=localStorage.getItem("hs-bag");if(saved)cart=JSON.parse(saved)||[]}catch(e){}
function save(){try{localStorage.setItem("hs-bag",JSON.stringify(cart))}catch(e){}}
function money(n){return"₹"+n.toLocaleString("en-IN")}
function ship(){var g=function(i){return($(i).value||"").trim()},n=g("f-n"),p=g("f-p").replace(/\D/g,""),a=g("f-a"),c=g("f-c"),z=g("f-z").replace(/\D/g,"");return{n:n,p:p,a:a,c:c,z:z,ok:n.length>1&&p.length>=10&&a.length>=8&&c.length>1&&z.length===6}}
function filters(){var t=["All"].concat(P.map(function(x){return x.t}).filter(function(v,i,a){return a.indexOf(v)===i}));
$("filters").innerHTML=t.map(function(x){return'<button class="chip" aria-pressed="'+(x===filter)+'" data-f="'+x+'">'+x+'</button>'}).join("")}
function grid(){$("grid").innerHTML=P.filter(function(x){return filter==="All"||x.t===filter}).map(function(x){
return'<article class="card"><button class="pic" data-cyc="'+x.id+'" aria-label="'+x.n+(x.i.length>1?', show another photo':'')+'"><img src="'+x.i[ph[x.id]||0]+'" alt="'+x.n+'" loading="lazy"></button><div class="info"><div class="row"><h3>'+x.n+'</h3><span class="price">'+money(x.p)+'</span></div><p class="story">'+x.st+'</p><div class="sizes" role="group" aria-label="Size for '+x.n+'">'+SIZES.map(function(z){return'<button class="sz" data-id="'+x.id+'" data-z="'+z+'" aria-pressed="'+(sel[x.id]===z)+'">'+z+'</button>'}).join("")+'</div><p class="msg" id="m'+x.id+'" role="status"></p><button class="add" data-add="'+x.id+'">Add to bag</button></div></article>'}).join("")}
function bag(){var n=0,t=0;$("count").textContent=cart.reduce(function(a,c){return a+c.q},0);
$("items").innerHTML=cart.length?cart.map(function(c,i){var p=P.filter(function(x){return x.id===c.id})[0];n+=c.q;t+=p.p*c.q;
return'<div class="item"><b>'+p.n+'</b><span class="price">'+money(p.p*c.q)+'</span><span class="story">Size '+c.z+'</span><span class="qty"><button data-q="'+i+'" data-d="-1" aria-label="Remove one">−</button>'+c.q+'<button data-q="'+i+'" data-d="1" aria-label="Add one">+</button></span></div>'}).join(""):'<p class="empty">Your bag is empty. Pick a size on any pair and add it.</p>';
cart.forEach(function(c){});t=cart.reduce(function(a,c){var p=P.filter(function(x){return x.id===c.id})[0];return a+p.p*c.q},0);
$("total").textContent=money(t);var o=$("order"),v=ship();if(cart.length&&v.ok){var m="Hi hidestori, I would like to order:\n"+cart.map(function(c){var p=P.filter(function(x){return x.id===c.id})[0];return"- "+p.n+", size "+c.z+", qty "+c.q+" = "+money(p.p*c.q)}).join("\n")+"\nTotal: "+money(t)+"\n\nDeliver to:\n"+v.n+"\nPhone: "+v.p+"\n"+v.a+"\n"+v.c+" - "+v.z;o.href="https://wa.me/919894128901?text="+encodeURIComponent(m);o.removeAttribute("aria-disabled");$("omsg").textContent=""}else{o.removeAttribute("href");o.setAttribute("aria-disabled","true");$("omsg").textContent=cart.length?"Fill in your name, phone and full address to order.":""}save()}
function show(o){$("bag").classList.toggle("open",o);$("shade").classList.toggle("on",o);if(o)$("close").focus();else $("open").focus()}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
if(b.dataset.f){filter=b.dataset.f;filters();grid()}
else if(b.classList.contains("sz")){sel[b.dataset.id]=+b.dataset.z;grid()}
else if(b.dataset.cyc){var q=P.filter(function(x){return x.id===+b.dataset.cyc})[0];ph[q.id]=((ph[q.id]||0)+1)%q.i.length;grid()}
else if(b.dataset.add){var id=+b.dataset.add,z=sel[id];if(!z){$("m"+id).textContent="Pick a size first.";return}
var f=cart.filter(function(c){return c.id===id&&c.z===z})[0];if(f)f.q++;else cart.push({id:id,z:z,q:1});$("omsg").textContent="";bag();show(true)}
else if(b.dataset.q){var c=cart[+b.dataset.q];c.q+=+b.dataset.d;if(c.q<1)cart.splice(+b.dataset.q,1);bag()}
else if(b.id==="open")show(true);
else if(b.id==="close")show(false);
});
$("shade").addEventListener("click",function(){show(false)});
document.addEventListener("keydown",function(e){if(e.key==="Escape")show(false)});
try{var s=JSON.parse(localStorage.getItem("hs-ship")||"{}");["n","p","a","c","z"].forEach(function(k){if(s[k])$("f-"+k).value=s[k]})}catch(e){}
document.querySelector(".ship").addEventListener("input",function(){try{localStorage.setItem("hs-ship",JSON.stringify({n:$("f-n").value,p:$("f-p").value,a:$("f-a").value,c:$("f-c").value,z:$("f-z").value}))}catch(e){}bag()});
filters();grid();bag();
</script>
